name: gh:deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
      - name: install
        run: bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install news fetcher
        working-directory: ci
        run: npm install
      - name: install headless browser
        working-directory: ci
        run: npx playwright install --with-deps chromium
      - name: fetch acls news
        id: fetch_news
        continue-on-error: true
        run: node ci/fetch_acls_news.js
      - name: pregenerate pages
        run: ruby src/_scripts/generate_resources.rb
      - name: prod build
        run: bundle exec rake reset && bundle exec rake build
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          cname: mapping-project.org
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
